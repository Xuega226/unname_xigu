name: lianghua_assistant
description: A local-first stock research and portfolio review prototype.
publish_to: none
version: 0.4.2+6
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  flutter_secure_storage: 9.2.4
  file_selector: 1.1.0
  pdfrx_engine: 0.6.1
  pdfium_flutter: 0.3.1
  crypto: ^3.0.7
  image: ^4.8.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - integration_test/fixtures/fictional-report.pdf
    - integration_test/fixtures/scanned-report.pdf
    - integration_test/fixtures/encrypted-report.pdf
